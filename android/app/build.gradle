plugins {
    id 'com.android.application'
}

def repoRoot = rootProject.projectDir.parentFile
def definesHeader = new File(repoRoot, 'src/defines.h')
def versionMatcher = (definesHeader.text =~ /#define\s+VERSION_STRING\s+"([^"]+)"/)
if (!versionMatcher.find()) {
    throw new RuntimeException("Could not find VERSION_STRING in src/defines.h")
}
def versionExtraMatcher = (definesHeader.text =~ /#define\s+VERSION_EXTRA\s+(\d+)/)
if (!versionExtraMatcher.find()) {
    throw new RuntimeException("Could not find VERSION_EXTRA in src/defines.h")
}

def gameVersion = versionMatcher.group(1)
def gameVersionParts = gameVersion.tokenize('.').collect { it as int }
if (gameVersionParts.size() != 3) {
    throw new RuntimeException("VERSION_STRING must contain major.minor.patch")
}
def gameVersionExtra = versionExtraMatcher.group(1) as int

def gameVersionCode =
        (gameVersionParts[0] * 1000000) +
        (gameVersionParts[1] * 10000) +
        (gameVersionParts[2] * 100) +
        gameVersionExtra

def readOptionalBuildValue = { String name ->
    def propertyValue = project.findProperty(name)
    if (propertyValue != null && propertyValue.toString().trim().length() > 0) {
        return propertyValue.toString()
    }

    def environmentValue = System.getenv(name)
    if (environmentValue != null && environmentValue.trim().length() > 0) {
        return environmentValue
    }

    return null
}

def androidCompileSdk = (readOptionalBuildValue('SIL_MORE_COMPILE_SDK') ?: '36') as Integer
def androidTargetSdk = (readOptionalBuildValue('SIL_MORE_TARGET_SDK') ?: '36') as Integer
// Allow a packaging-only update without changing the game's save format.
def androidVersionCode =
        (readOptionalBuildValue('SIL_MORE_VERSION_CODE') ?: gameVersionCode.toString()) as Integer
def buildApk2 = (readOptionalBuildValue('SIL_MORE_APK2') ?: 'false').toBoolean()
def buildBundle = (readOptionalBuildValue('SIL_MORE_BUILD_BUNDLE') ?: 'false').toBoolean()
// Package both common ARM ABIs by default. Deploy helpers override this to ARM64 only.
def nativeAbis = (readOptionalBuildValue('SIL_MORE_ANDROID_ABIS') ?: 'arm64-v8a,armeabi-v7a')
        .split(',').collect { it.trim() }.findAll { it }

if (androidVersionCode < gameVersionCode || androidVersionCode > 2100000000) {
    throw new GradleException(
            "Android version code must be between $gameVersionCode and 2100000000."
    )
}

if (androidCompileSdk < androidTargetSdk) {
    throw new GradleException(
            "Compile SDK ($androidCompileSdk) must be at least the target SDK ($androidTargetSdk)."
    )
}

// Play Console supplies these IDs; unconfigured local builds keep achievements local.
// Keep resource/index order tied to the native catalogue used by the JNI bitmask.
def achievementHeader = new File(repoRoot, 'src/achievements.h')
def achievementEnum = (achievementHeader.text =~ /(?s)typedef\s+enum\s+sil_achievement_id\s*\{(.*?)\}\s*sil_achievement_id\s*;/)
if (!achievementEnum.find()) {
    throw new GradleException('Could not find sil_achievement_id in src/achievements.h.')
}
def playAchievementKeys = (achievementEnum.group(1) =~ /\bSIL_ACH_([A-Z][A-Z0-9_]*)\b/)
        .collect { match -> match[1] }.findAll { it != 'COUNT' }
if (!playAchievementKeys || playAchievementKeys.size() >= 32 ||
        playAchievementKeys.toSet().size() != playAchievementKeys.size()) {
    throw new GradleException('The native achievement catalogue must have 1-31 unique bitmask indexes.')
}
// Provider IDs are public build configuration. Keep release builds configured
// across shells and CI; command-line properties/environment still take priority.
def playGamesProperties = new Properties()
def playGamesConfigPath = readOptionalBuildValue('SIL_MORE_PLAY_GAMES_CONFIG')
def playGamesConfigFile = playGamesConfigPath ? rootProject.file(playGamesConfigPath) :
        new File(rootProject.projectDir, 'play-games.properties')
if (playGamesConfigFile.isFile()) {
    playGamesConfigFile.withInputStream { playGamesProperties.load(it) }
} else if (playGamesConfigPath) {
    throw new GradleException("Play Games configuration file does not exist: $playGamesConfigFile")
}
def readPlayGamesValue = { String name ->
    readOptionalBuildValue(name) ?: playGamesProperties.getProperty(name, '')
}
def playGamesProjectId = readPlayGamesValue('SIL_MORE_PLAY_GAMES_PROJECT_ID').trim()
def playAchievementIds = playAchievementKeys.collect { key ->
    readPlayGamesValue('SIL_MORE_PLAY_ACH_' + key).trim()
}
if (playGamesProjectId && !(playGamesProjectId ==~ /[1-9][0-9]*/)) {
    throw new GradleException('SIL_MORE_PLAY_GAMES_PROJECT_ID must be the numeric Games services project ID.')
}
def playGamesConfigured = playGamesProjectId && playAchievementIds.every { it }
if ((playGamesProjectId || playAchievementIds.any { it }) && !playGamesConfigured) {
    throw new GradleException("Play Games requires the project ID and all ${playAchievementKeys.size()} SIL_MORE_PLAY_ACH_* IDs together.")
}
if (playGamesConfigured && playAchievementIds.toSet().size() != playAchievementIds.size()) {
    throw new GradleException('Each Google Play achievement must have its own distinct Console ID.')
}
// Resource strings contain only provider IDs, never credentials. Restrict their syntax
// so generated XML is safe without changing the IDs supplied by Play Console.
if (playAchievementIds.any { it && !(it ==~ /[A-Za-z0-9_-]+/) }) {
    throw new GradleException('Google Play achievement IDs must contain only letters, digits, _ or -.')
}

def releaseStoreFile = readOptionalBuildValue('SIL_MORE_RELEASE_STORE_FILE')
def releaseStorePassword = readOptionalBuildValue('SIL_MORE_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = readOptionalBuildValue('SIL_MORE_RELEASE_KEY_ALIAS')
def releaseKeyPassword = readOptionalBuildValue('SIL_MORE_RELEASE_KEY_PASSWORD')
def releaseSigningValues = [
        releaseStoreFile,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword
]
def hasAnyReleaseSigningValue = releaseSigningValues.any { it != null }
def hasReleaseSigning = releaseSigningValues.every { it != null }
def requireReleaseSigning =
        (readOptionalBuildValue('SIL_MORE_REQUIRE_RELEASE_SIGNING') ?: 'false').toBoolean()

if ((hasAnyReleaseSigningValue || requireReleaseSigning) && !hasReleaseSigning) {
    throw new GradleException(
            'Incomplete release signing configuration. Set SIL_MORE_RELEASE_STORE_FILE, ' +
            'SIL_MORE_RELEASE_STORE_PASSWORD, SIL_MORE_RELEASE_KEY_ALIAS, and ' +
            'SIL_MORE_RELEASE_KEY_PASSWORD.'
    )
}

android {
    namespace 'com.silmore.myapp'
    compileSdk androidCompileSdk
    ndkVersion '27.3.13750724'
    flavorDimensions 'delivery'

    if (!buildBundle) {
        splits {
            abi {
                enable true
                reset()
                include(*nativeAbis)
                universalApk true
            }
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId 'com.silmore.myapp'
        minSdk 24
        targetSdk androidTargetSdk
        versionCode androidVersionCode
        versionName "${gameVersion}.${gameVersionExtra}"
        // Select a distinct launcher label for the APK2 installation while
        // retaining the existing labels for the primary app and debug builds.
        manifestPlaceholders = [
                appNameResource: buildApk2 ? 'app_name_apk2' : 'app_name'
        ]

        if (buildBundle) {
            ndk {
                abiFilters.addAll(nativeAbis)
            }
        }

        externalNativeBuild {
            cmake {
                // Apply the NDK's flexible-page mode to every vendored shared
                // library, including SDL and image codecs, not only libmain.
                arguments '-DSIL_BUILD_WITH_SDL_SOURCES=ON',
                        '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
            }
        }
    }

    productFlavors {
        play {
            dimension 'delivery'
            resValue 'string', 'play_games_project_id', playGamesProjectId
            resValue 'bool', 'play_games_configured', playGamesConfigured ? 'true' : 'false'
            playAchievementKeys.eachWithIndex { key, index ->
                resValue 'string', 'play_ach_' + key.toLowerCase(Locale.ROOT), playAchievementIds[index]
            }
        }
        sideload {
            dimension 'delivery'
            applicationIdSuffix '.sideload'
        }
    }

    buildTypes {
        debug {
            // Keep local debug installs separate from both the Play app and
            // the release sideload APK so they can coexist on one device.
            applicationIdSuffix buildApk2 ? '.debug.apk2' : '.debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    new File(repoRoot, 'external/SDL/android-project/app/proguard-rules.pro'),
                    'proguard-rules.pro'
            if (buildApk2) {
                applicationIdSuffix '.apk2'
            }
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }

    sourceSets {
        main {
            // Bundle game data as assets/lib/...
            assets.srcDirs += [file("${buildDir}/generated/assets")]

            // If the SDL submodule is initialized, include SDL's Android Java sources.
            // This provides org.libsdl.app.SDLActivity.
            java.srcDirs += [file("${rootProject.projectDir}/../external/SDL/android-project/app/src/main/java")]
        }
    }
}

tasks.register('syncGameAssets', Sync) {
    def gameLibDir = new File(repoRoot, 'lib')
    def outDir = new File(buildDir, 'generated/assets/lib')

    from(gameLibDir) {
        // Never package runtime state into the APK.
        exclude 'save/**', 'save'
        exclude 'user/**', 'user'
        exclude 'apex/**', 'apex'

        // Android APKs ship OGG-only audio. Exclude legacy WAVs and the
        // reference/source sound packs entirely.
        exclude '**/*.wav'
        exclude 'xtra/sound/packs/**', 'xtra/sound/packs'
    }
    into(outDir)
}

tasks.named('preBuild') {
    dependsOn(tasks.named('syncGameAssets'))
}

// The APK2 switch changes the application ID while reusing the normal
// delivery/build variant. Make it part of every task's input so switching
// between the primary APK and APK2 cannot reuse stale manifests or outputs.
tasks.configureEach {
    inputs.property('silMoreApk2', buildApk2)
}

dependencies {
    playImplementation 'com.google.android.gms:play-services-games-v2:22.1.0'
}
